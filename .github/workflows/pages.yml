# Публикация игры как статического сайта на GitHub Pages.
#
# Что получается: ссылка вида https://<логин>.github.io/<репозиторий>/
# открывается в любом браузере без установки Node, npm и Termux.
# Ключ Yukino вставляется в самой игре и хранится только в localStorage.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build static site
        # BASE_PATH нужен, чтобы ассеты грузились из подкаталога /<repo>/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
