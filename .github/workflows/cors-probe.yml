name: CORS probe (temporary)
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/cors-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe Yukino CORS
        run: |
          set +e
          {
            echo "== OPTIONS preflight =="
            curl -sS -i -X OPTIONS https://api.yukino.my/v1/chat/completions \
              -H 'Origin: https://rupuone1-art.github.io' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,content-type,x-yukino-key' \
              --max-time 25
            echo
            echo "== POST with Origin =="
            curl -sS -i -X POST https://api.yukino.my/v1/chat/completions \
              -H 'Origin: https://rupuone1-art.github.io' \
              -H 'Content-Type: application/json' \
              -H 'Authorization: Bearer sk-yuk-invalid-probe' \
              -d '{"model":"yukino-free","messages":[{"role":"user","content":"ping"}]}' \
              --max-time 25
          } > cors-report.txt 2>&1
          echo "--- done, size: $(wc -c < cors-report.txt)"

      - name: Commit report
        run: |
          git config user.name "cors-probe"
          git config user.email "cors-probe@users.noreply.github.com"
          git add cors-report.txt
          git commit -m "chore: отчёт по CORS Yukino" || echo "nothing to commit"
          git push
